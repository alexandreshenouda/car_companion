name: iOS build

# Builds an UNSIGNED .ipa for the iOS app on a GitHub-hosted macos-latest runner — this
# is the only piece of the pipeline that genuinely requires macOS (Xcode doesn't run on
# Linux). Nobody has to own or maintain that Mac: it's ephemeral CI infrastructure.
# Signing + install happens afterward, entirely on Linux — see README.md's "iOS port"
# section for the rest of the pipeline (SignTools, self-hosted, free-Apple-ID signing).
on:
  push:
    branches: [main]
    paths:
      - "shared/**"
      - "iosApp/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch: {}

permissions:
  contents: write # only needed for the rolling "ios-latest" release upload step below

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Proves the :shared iOS actuals (Keychain settings, NSBundle asset reads,
      # NSFileManager file storage, zlib, Room's iOS database builder) actually compile
      # and pass on a real Apple Silicon target — README previously marked these
      # "UNVERIFIED (no Xcode/iOS SDK available)".
      - name: Test :shared on iosSimulatorArm64
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      # embedAndSignAppleFrameworkForXcode runs automatically as iosApp's preBuildScripts
      # phase (see iosApp/project.yml) — xcodebuild triggers it, no separate gradle step
      # needed here.
      - name: Build unsigned .app (device arch, no code signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath iosApp/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          app_path="iosApp/build/Build/Products/Debug-iphoneos/iosApp.app"
          test -d "$app_path"
          mkdir -p Payload
          cp -r "$app_path" Payload/
          zip -r iosApp-unsigned.ipa Payload
          echo "ipa_path=$(pwd)/iosApp-unsigned.ipa" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: iosApp-unsigned-ipa
          path: iosApp-unsigned.ipa
          retention-days: 14

      # Rolling release so SignTools (or the fetch script in Phase 3) always has a
      # stable download URL for "the latest unsigned build" instead of hunting through
      # workflow run artifacts.
      - name: Publish to rolling "ios-latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete ios-latest --yes --cleanup-tag || true
          gh release create ios-latest "$ipa_path" \
            --title "iOS (unsigned, latest main)" \
            --notes "Auto-published by .github/workflows/ios.yml from $GITHUB_SHA. Unsigned — sign with SignTools before installing." \
            --prerelease
