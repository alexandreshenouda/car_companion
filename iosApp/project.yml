name: iosApp
options:
  bundleIdPrefix: com.shenzou
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Shared.framework is static (see shared/build.gradle.kts) so no "embed" step is
    # needed beyond linking — embedAndSignAppleFrameworkForXcode (run below) drops it
    # under $SRCROOT/../shared/build/xcode-frameworks, searched here.
    FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME) $(inherited)"
    OTHER_LDFLAGS: "-framework Shared $(inherited)"

targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iosApp
    resources:
      - path: iosApp/Resources
    info:
      path: iosApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shenzou.carcompanion
        PRODUCT_NAME: iosApp
        # Ad-hoc/free-Apple-ID signing is handled outside Xcode (SignTools, on the
        # Ubuntu side) once CI hands off an unsigned .ipa — CI itself always builds
        # with CODE_SIGNING_ALLOWED=NO, so these are placeholders for local/manual use
        # only, never exercised by the pipeline.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
    preBuildScripts:
      - name: "Build :shared Kotlin framework"
        script: |
          set -e
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)/Shared.framework/Shared"
